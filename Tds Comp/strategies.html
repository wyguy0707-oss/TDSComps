  <style>
    /* Reset & Fonts */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* Fixed Background Image Layer */
    #bg-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(rgba(15, 23, 42, 0.4), rgba(15, 23, 42, 0.6)), 
                  url('TDSComp(banner).jpg') no-repeat center center;
      background-size: cover;
      z-index: 0;
      pointer-events: none;
    }

    /* Floating Sakura Layer */
    #blossom-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    /* Top Navigation Link Bar */
    header {
      width: 100%;
      background-color: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      border-bottom: 2px solid rgba(255, 255, 255, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    nav {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.05rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: color 0.2s, transform 0.2s;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
    }

    nav a:hover, nav a.active {
      color: #FAA0A0; /* Pastel Red Highlight */
      transform: translateY(-2px);
    }

    /* Main Container */
    main {
      position: relative;
      z-index: 2;
      width: 80vw;
      max-width: 1400px;
      min-height: calc(100vh - 80px);
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Glassmorphism Section Card */
    .content-box {
      background: rgba(20, 20, 25, 0.8);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 8px;
      padding: 40px;
      box-shadow: 0 8px 25px rgba(50, 0, 10, 0.7);
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex-grow: 1;
    }

    .page-title {
      color: #FAA0A0;
      font-size: 2.2rem;
      font-weight: 700;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
      border-bottom: 2px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 12px;
    }

    .page-text {
      color: #FFE6EA;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    @media (max-width: 900px) {
      main {
        width: 95vw;
        padding: 20px 10px;
      }
      nav {
        gap: 15px;
      }
      nav a {
        font-size: 0.85rem;
      }

  <!-- Cherry Blossom Animation Script (Upward Growing Floor Pile) -->
  <script>
    const canvas = document.getElementById('blossom-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const TOTAL_PETALS = 30;
    const MAX_SETTLED_PETALS = 2000;
    const fallingPetals = [];
    const settledPetals = [];

    class Petal {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * -canvas.height;
        this.size = Math.random() * 10 + 8;
        this.speedY = Math.random() * 1.5 + 0.8;
        this.speedX = Math.random() * 1 - 0.5;
        this.angle = Math.random() * Math.PI * 2;
        this.spin = Math.random() * 0.02 - 0.01;
        this.opacity = Math.random() * 0.4 + 0.6;
      }

      update() {
        this.y += this.speedY;
        this.x += Math.sin(this.y * 0.01) + this.speedX;
        this.angle += this.spin;

        if (this.y > canvas.height + 20) {
          if (settledPetals.length < MAX_SETTLED_PETALS) {
            const fillRatio = settledPetals.length / MAX_SETTLED_PETALS;
            const maxPileHeight = canvas.height * 0.8;
            const currentPileTop = canvas.height - (fillRatio * maxPileHeight);

            settledPetals.push({
              x: Math.random() * canvas.width,
              y: currentPileTop + (Math.random() * (canvas.height - currentPileTop)),
              size: this.size,
              angle: Math.random() * Math.PI * 2,
              opacity: Math.random() * 0.3 + 0.3
            });
          }
          this.reset();
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.fillStyle = `rgba(255, 183, 197, ${this.opacity})`;
        
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-this.size, -this.size / 2, -this.size, this.size, 0, this.size * 1.5);
        ctx.bezierCurveTo(this.size, this.size, this.size, -this.size / 2, 0, 0);
        ctx.fill();
        ctx.restore();
      }
    }

    function drawSettledPetal(p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);
      ctx.fillStyle = `rgba(255, 183, 197, ${p.opacity})`;
      
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-p.size, -p.size / 2, -p.size, p.size, 0, p.size * 1.5);
      ctx.bezierCurveTo(p.size, p.size, p.size, -p.size / 2, 0, 0);
      ctx.fill();
      ctx.restore();
    }

    for (let i = 0; i < TOTAL_PETALS; i++) {
      fallingPetals.push(new Petal());
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      settledPetals.forEach(p => drawSettledPetal(p));
      fallingPetals.forEach(petal => {
        petal.update();
        petal.draw();
      });
      requestAnimationFrame(animate);
    }

    animate();
  </script>

</body>
</html>
